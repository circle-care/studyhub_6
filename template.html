<style>
/* ... Keep all your CSS styles here exactly as they are in your file ... */
.notes-header { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 3px solid var(--calc); border-radius: 12px 12px 0 0; overflow: hidden; margin-bottom: 0; font-size: 14px; }
.notes-header-cell { padding: 10px 16px; background: var(--calc); color: #fff; font-weight: 700; text-align: center; border-right: 2px solid rgba(255,255,255,0.3); }
.notes-header-cell:last-child { border-right: none; }
.notes-header-cell span { display: block; font-size: 11px; opacity: 0.75; font-weight: 400; margin-bottom: 2px; }
.notes-title-bar { background: var(--calc-light); border: 3px solid var(--calc); border-top: none; padding: 12px 20px; font-size: 20px; font-weight: 700; color: var(--calc-dark); margin-bottom: 0; display: flex; align-items: center; gap: 12px; }
.page-num { background: var(--calc); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.notes-grid { display: grid; grid-template-columns: 1fr 1.4fr 1fr; border: 3px solid var(--calc); border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; margin-bottom: 2.5rem; }
.notes-col { padding: 20px; border-right: 2px solid var(--border); }
.notes-col:last-child { border-right: none; }
.col-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--calc); margin-bottom: 14px; padding-bottom: 6px; border-bottom: 2px solid var(--calc-light); }
.notes-col p { margin-bottom: 12px; font-size: 16px; line-height: 1.8; }
.notes-col p:last-child { margin-bottom: 0; }
.highlight { background: #FEF9C3; border-left: 4px solid #EAB308; padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; font-size: 15px; line-height: 1.8; }
.key-box { background: var(--calc-light); border: 2px solid var(--calc); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 15px; line-height: 1.9; }
.example-box { background: #F0FDF4; border: 2px solid #16A34A; border-radius: 10px; padding: 14px 16px; margin: 12px 0; font-size: 15px; line-height: 1.9; }
.warn-box { background: #FEF2F2; border: 2px solid #DC2626; border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 14px; line-height: 1.8; }
.graph-box { background: var(--bg); border: 2px dashed var(--border); border-radius: 10px; padding: 16px; margin: 12px 0; text-align: center; font-size: 13px; color: var(--muted); }
.graph-ascii { font-family: monospace; font-size: 13px; color: var(--calc-dark); line-height: 1.5; display: block; margin-bottom: 6px; }
.divider { border: none; border-top: 2px solid var(--border); margin: 16px 0; }
table.limit-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0; }
table.limit-table th { background: var(--calc); color: #fff; padding: 8px 12px; text-align: center; font-size: 13px; }
table.limit-table td { padding: 7px 12px; border: 1px solid var(--border); text-align: center; }
table.limit-table tr:nth-child(even) td { background: var(--bg); }
.arrow-right { color: var(--calc); font-weight: 700; }
.cont-header-cell { background: #0E7490; }
.notes-cont .notes-header { border-color: #0E7490; }
.notes-cont .notes-title-bar { background: #CFFAFE; border-color: #0E7490; color: #164E63; }
.notes-cont .page-num { background: #0E7490; }
.notes-cont .notes-grid { border-color: #0E7490; }
.notes-cont .col-label { color: #0E7490; border-bottom-color: #CFFAFE; }
.notes-cont .key-box { background: #CFFAFE; border-color: #0E7490; }
.notes-cont .notes-title-bar { background: #CFFAFE; border-color: #0E7490; color: #164E63; }
.notes-cont .highlight { border-left-color: #0E7490; background: #ECFEFF; }
/* Adding your custom theme wrappers */
.theme-calc { --calc: #0E7490; --calc-light: #CFFAFE; --calc-dark: #164E63; }
.theme-algebra { --calc: #b06000; --calc-light: #fef7e0; --calc-dark: #5c3200; }
</style>
